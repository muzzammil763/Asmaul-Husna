name: asmaul_husna
description: "Asmaul Husna — the 99 beautiful names of Allah, fully offline."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Trimmed to what the app draws; see tool/subset_fonts.py.
  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
        - asset: assets/fonts/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
    - family: Boldonse
      fonts:
        - asset: assets/fonts/Boldonse-Regular.ttf
    - family: PDMS Saleem Quran
      fonts:
        - asset: assets/fonts/PDMSSaleemQuran.ttf
    - family: Jameel Noori Nastaleeq
      fonts:
        - asset: assets/fonts/JameelNooriNastaleeq.ttf

  assets:
    - assets/licenses/
