name: asmaul_husna
description: "Asmaul Husna — the 99 beautiful names of Allah, fully offline."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Trimmed to the characters the app uses; see tool/subset_fonts.py.
  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans.ttf
    - family: Boldonse
      fonts:
        - asset: assets/fonts/Boldonse.ttf
    - family: Amiri Quran
      fonts:
        - asset: assets/fonts/AmiriQuran.ttf
    - family: Noto Nastaliq Urdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
